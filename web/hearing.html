<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-mlp="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开庭公告 · Lexify</title>
<meta name="description" content="全国法院开庭传票与排期表，按被告类型、案由、开庭时间筛选，识别刚收到传票还没委托律师的商事被告。">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="millennium.css">
</head>
<body class="board-hearing">

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M7.8 4.4Q7 4.4 7 5.2v13.5h10v-2.2a1.1 1.1 0 0 0-1.1-1.1h-5.7V4.4z" fill="currentColor"/>
        </svg>
    </span>
    <span class="brand-text"><strong>Lexify</strong><em>法律数据洞察平台</em></span>
  </a>

  <nav class="btabs" aria-label="看板切换">
    <a href="tender.html" data-b="tender"><i class="bdot"></i>招标雷达</a>
    <a href="hearing.html" data-b="hearing" class="on"><i class="bdot"></i>开庭公告</a>
    <a href="bounty.html" data-b="bounty"><i class="bdot"></i>执行悬赏</a>
  </nav>

  <div class="topbar-right">
      </div>
</header>

<div class="bhead">
  <div class="wrap">
    <div class="bhead-in">
      <h1 id="bTitle"></h1>
      <div class="bhead-row">
        <p class="sub" id="bSub"></p>
        <div class="bhead-meta" id="bMeta"></div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</div>

<div class="filters">
  <div class="wrap" id="facets"></div>
</div>

<main class="board-main">
  <div class="wrap">
    <div class="toolbar">
      <div class="tsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.6"/><path d="m16.2 16.2 4.3 4.3"/>
        </svg>
        <input id="q" type="search" placeholder="搜法院、案由、当事人、案号或正文…" autocomplete="off">
      </div>
      <span class="tcount" id="tcount"></span>
      <button class="btn-sm" id="btnReset">清空筛选</button>
      <button class="btn-sm solid" id="btnExport">导出 CSV</button>
    </div>

    <div class="mgrid">
      <div class="twrap">
        <div class="tscroll">
          <table class="list">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
      <aside class="aside" id="aside"></aside>
    </div>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-box">
    <div class="modal-h">
      <div>
        <h3 id="mTitle"></h3>
        <div class="sub" id="mSub"></div>
      </div>
      <button class="modal-x" data-close>×</button>
    </div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f">
      <a class="btn-sm" id="mLink" target="_blank" rel="noopener">去法院官网看原文</a>
      <button class="btn-sm" data-close>关闭</button>
    </div>
  </div>
</div>

<script src="data/hearing.js"></script>
<script src="board.js"></script>
<script>
(function () {
  var U = window.LexUtil;
  var esc = U.esc, money = U.money;

  var DEF_LABEL = { company: "企业", mixed: "企业+个人", person: "自然人", unknown: "未披露" };

  function defTag(t) {
    if (t === "company" || t === "mixed") return '<span class="tag mc">' + DEF_LABEL[t] + "</span>";
    if (t === "person") return '<span class="tag dim">自然人</span>';
    return "";
  }

  function clip(s, n) {
    s = s || "";
    if (s.length <= n) return s;
    return s.slice(0, n) + "…";
  }

  function dayCell(r) {
    var d = U.daysFrom(r.heaDate);
    if (d == null) return "";
    var cls = "";
    if (d < 0) cls = "past";
    else if (d <= 7) cls = "soon";
    else if (d <= 30) cls = "week";
    var txt = d < 0 ? "已开庭" : (d === 0 ? "今天" : d + " 天后");
    return '<span class="days ' + cls + '">' + txt + "</span>";
  }

  function whenText(r) {
    var w = r.heaAt || "未定期";
    if (/ 00:00(:00)?$/.test(w)) return w.slice(0, 10);
    return w;
  }

  /* 线索价值：企业被告 > 混合 > 自然人 > 未披露，再看金额、商事、临近程度 */
  function valueScore(r) {
    var base = { company: 3, mixed: 2.5, person: 1, unknown: 0 };
    var s = base[r.defType];
    if (s == null) s = 0;
    if (r.amount) s += 1;
    if (r.comm) s += 0.4;
    var d = U.daysFrom(r.heaDate);
    if (d != null && d >= 0) s += Math.max(0, 0.3 - d / 200);
    return s;
  }

  LexBoard({
    title: "开庭公告",
    en: "Hearing Docket",
    tagline: "法院开庭传票与排期表。重点不是「有哪些案子」，而是「哪个企业被告刚收到传票、还没找律师」。",
    dateField: "heaDate",
    amountField: "amount",
    search: ["court", "cause", "plaintiff", "defendant", "caseNo", "room", "body"],

    metaExtra: function () {
      return " · 数据源 <b>法院公告网（深圳 / 广州 / 东莞 / 惠州）+ 深圳各区法院官网排期表</b>";
    },

    kpis: [
      { label: "开庭公告", value: function (r, m) { return m.total; } },
      { label: "家法院", value: function (r, m) { return m.courts; } },
      { label: "30 天内开庭", value: function (r, m) { return m.upcoming; }, tone: "accent" },
      // 原来是「企业被告 · 15–30 天」的条数，与右侧标签口径重复、也不构成金额；
      // 换成涉案金额，条数退到标签里交代「多少条才有金额」。
      {
        label: function (m) { return "已披露涉案金额 · " + m.withAmount + " 条"; },
        value: function (r, m) { return m.amountSum; },
        fmt: "money"
      }
    ],

    dayPresets: [
      { key: "d7", label: "7 天内", test: function (d) { return d != null && d >= 0 && d <= 7; } },
      { key: "d15", label: "15 天内", test: function (d) { return d != null && d >= 0 && d <= 15; } },
      { key: "d1530", label: "15–30 天", test: function (d) { return d != null && d >= 15 && d <= 30; } },
      { key: "d3060", label: "30–60 天", test: function (d) { return d != null && d > 30 && d <= 60; } },
      { key: "past", label: "已开庭", test: function (d) { return d != null && d < 0; } }
    ],

    facets: [
      { key: "days", label: "开庭时间", type: "days" },
      {
        key: "defType", label: "被告类型", type: "multi", field: "defType",
        labelOf: function (k) { return DEF_LABEL[k] || k; }
      },
      { key: "cause", label: "案由", type: "multi", field: "cause", top: 10 },
      { key: "prov", label: "地区", type: "multi", field: "prov", top: 10 },
      { key: "city", label: "城市", type: "multi", field: "city", top: 8 },
      {
        key: "amount", label: "涉案金额", type: "amount", unit: "元",
        presets: [
          { label: "100 万以上", min: 1000000, max: null },
          { label: "500 万以上", min: 5000000, max: null },
          { label: "1000 万以上", min: 10000000, max: null }
        ]
      },
      {
        key: "src", label: "数据源", type: "multi", field: "src",
        labelOf: function (k) {
          var m = {
            rmfygg_kt: "公告网·开庭传票",
            court_schedule: "法院排期表",
            court_kt: "法院官网·开庭公告"
          };
          return m[k] || k;
        }
      }
    ],

    sort: { key: "defendant", dir: "desc" },

    columns: [
      {
        key: "heaDate", label: "开庭时间", cls: "nowrap", w: "15%", firstDir: "asc",
        render: function (r) {
          // 倒计时与「推算」标记都放第二行，保证每行等高
          var sub = dayCell(r);
          if (r.est) sub += ' <span class="tag warn">推算</span>';
          return '<span class="t-main">' + esc(whenText(r)) + "</span>" +
                 '<span class="t-sub">' + sub + "</span>";
        },
        csvVal: function (r) { return r.heaAt || ""; }
      },
      {
        key: "court", label: "法院", cls: "c-court", w: "21%",
        render: function (r) {
          var sub = r.prov || "未识别";
          if (r.room) sub += " · " + r.room;
          return '<span class="t-main">' + esc(r.court || "—") + "</span>" +
                 '<span class="t-sub">' + esc(sub) + "</span>";
        }
      },
      {
        key: "cause", label: "案由", cls: "c-cause", w: "18%",
        render: function (r) {
          var main = '<span class="t-main">' + esc(r.cause || "未识别") + "</span>";
          if (!r.group) return main;
          return main + '<span class="t-sub">' + esc(r.group) + "</span>";
        }
      },
      {
        key: "defendant", label: "被告 / 原告", cls: "c-party", w: "32%", firstDir: "desc",
        sortVal: valueScore,
        render: function (r) {
          var raw = r.defendant || "";
          var main;
          if (raw) {
            main = '<span class="t-main" title="' + esc(raw) + '">' + esc(clip(raw, 34)) + "</span>";
          } else {
            main = '<span class="t-main" style="color:var(--text-3)">未披露</span>';
          }
          var sub = "";
          if (r.plaintiff) {
            sub = '<span class="t-sub" title="' + esc(r.plaintiff) + '">原告 ' +
                  esc(clip(r.plaintiff, 22)) + "</span>";
          }
          return main + defTag(r.defType) + sub;
        }
      },
      {
        key: "amount", label: "涉案金额", cls: "num", w: "14%", firstDir: "desc",
        render: function (r) {
          if (!r.amount) return '<span style="color:var(--text-3)">—</span>';
          return "<b>" + esc(money(r.amount)) + "</b>";
        },
        csvVal: function (r) { return r.amount == null ? "" : Math.round(r.amount); }
      },
      {
        key: "caseNo", label: "案号", cls: "nowrap", csv: true,
        // 案号不进表格（太占宽度，金额更该露出来），但仍在搜索里，
        // 也保留在 CSV 导出和详情弹窗
        hidden: true,
        render: function (r) {
          return '<span class="t-mono">' + esc(r.caseNo || "—") + "</span>";
        }
      }
    ],

    dist: [
      { label: "案由分布", field: "cause", top: 8, emptyLabel: "未识别" },
      { label: "地区分布", field: "prov", top: 8, emptyLabel: "未识别" }
    ],

    presets: [
      {
        label: "企业被告 · 15–30 天开庭",
        test: function (r) {
          var d = U.daysFrom(r.heaDate);
          return (r.defType === "company" || r.defType === "mixed") && d != null && d >= 15 && d <= 30;
        },
        apply: function (st) {
          st.multi.defType = { company: true, mixed: true };
          st.days = "d1530";
        }
      },
      {
        label: "只看企业被告",
        test: function (r) { return r.defType === "company" || r.defType === "mixed"; },
        apply: function (st) { st.multi.defType = { company: true, mixed: true }; }
      },
      {
        label: "7 天内开庭",
        test: function (r) {
          var d = U.daysFrom(r.heaDate);
          return d != null && d >= 0 && d <= 7;
        },
        apply: function (st) { st.days = "d7"; }
      },
      {
        label: "标的 100 万以上",
        test: function (r) { return r.amount != null && r.amount >= 1e6; },
        apply: function (st) { st.amountMin = 1000000; }
      },
      {
        label: "深圳 · 中院与各区法院",
        test: function (r) { return /^深圳市|^广东省深圳市/.test(r.court || ""); },
        apply: function (st) { st.multi.city = { "深圳市": true }; }
      },
      {
        label: "深圳 · 企业被告",
        test: function (r) {
          return /^深圳市|^广东省深圳市/.test(r.court || "") &&
                 (r.defType === "company" || r.defType === "mixed");
        },
        apply: function (st) {
          st.multi.city = { "深圳市": true };
          st.multi.defType = { company: true, mixed: true };
        }
      },
      {
        label: "广州 · 各区法院",
        test: function (r) { return r.city === "广州市"; },
        apply: function (st) { st.multi.city = { "广州市": true }; }
      },
      {
        label: "东莞 · 三家法院",
        test: function (r) { return r.city === "东莞市"; },
        apply: function (st) { st.multi.city = { "东莞市": true }; }
      }
    ],

    asideNote: "金额与当事人是程序从公告正文抽取的。公告送达的传票多数只写「详见起诉状」，" +
      "金额空缺不等于没有标的。",

    detail: function (r) {
      var d = U.daysFrom(r.heaDate);
      var when = r.heaAt || "未定期";
      if (d != null) when += "（" + (d < 0 ? "已开庭" : d + " 天后") + "）";
      var amt = "未披露";
      if (r.amount) {
        amt = "<b>" + esc(money(r.amount)) + "</b>（" +
              Math.round(r.amount).toLocaleString("zh-CN") + " 元）";
      }
      var srcLabel = r.src === "rmfygg_kt" ? "人民法院公告网·开庭传票"
        : r.src === "court_kt" ? "法院官网·开庭公告"
        : "法院官网排期表";
      return {
        title: r.court || "开庭公告",
        sub: [r.caseNo, r.cause].filter(Boolean).join(" · "),
        kv: [
          ["开庭时间", esc(when) + (r.est ? ' <span class="tag warn">推算</span>' : "")],
          ["法庭", esc(r.room || "—")],
          ["案由", esc(r.cause || "未识别") + (r.group ? ' <span class="tag">' + esc(r.group) + "</span>" : "")],
          ["原告", esc(r.plaintiff || "未披露")],
          ["被告", esc(r.defendant || "未披露") + " " + defTag(r.defType)],
          ["涉案金额", amt],
          ["公告类型", esc(r.ntype || "—")],
          ["发布日期", esc(r.pub || "—")],
          ["数据源", esc(srcLabel)]
        ]
      };
    }
  });})();
</script>
</body>
</html>
