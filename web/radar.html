<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-mlp="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快捷检索 · lexify</title>
<meta name="description" content="lexify 快捷检索：按关键词、地区、类型、预算区间与截止状态快速定位法律服务采购公告。筛选与分页都由后端实时完成。">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="millennium.css">
<link rel="stylesheet" href="radar.css">
</head>
<body class="board-tender dash-page">

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M7.8 4.4Q7 4.4 7 5.2v13.5h10v-2.2a1.1 1.1 0 0 0-1.1-1.1h-5.7V4.4z" fill="currentColor"/>
      </svg>
    </span>
    <span class="brand-text"><strong>lexify</strong><em>法律数据洞察平台</em></span>
  </a>
  <nav class="nav" id="nav">
    <a href="index.html">首页</a>
    <a href="tender.html">招标雷达</a>
    <a href="radar.html" class="on">快捷检索</a>
  </nav>
  <div class="topbar-right">
    <span class="live-pill" id="livePill"><i class="live-dot"></i><span id="liveText">连接中…</span></span>
  </div>
</header>

<main>
  <section class="dash-head">
    <div class="wrap">
      <p class="dash-eyebrow">招标雷达 · 快捷检索</p>
      <h1 class="dash-title">还没截止的标，<span class="hl">一条都别漏</span>。</h1>
      <p class="dash-sub">筛选与分页都在后端完成，结果直接来自数据库。</p>
    </div>
  </section>

  <section class="wrap radar-body">
    <aside class="radar-filter" id="filter">
      <div class="rf-group">
        <label class="rf-label" for="fq">关键词</label>
        <input id="fq" class="rf-input" type="search" placeholder="标题 / 采购人 / 正文" autocomplete="off">
      </div>

      <div class="rf-group">
        <label class="rf-label" for="fprov">地区</label>
        <select id="fprov" class="rf-input"><option value="">全部地区</option></select>
      </div>

      <div class="rf-group">
        <label class="rf-label" for="ftype">公告类型</label>
        <select id="ftype" class="rf-input"><option value="">全部类型</option></select>
      </div>

      <div class="rf-group">
        <label class="rf-label">预算区间（元）</label>
        <div class="rf-row">
          <input id="fmin" class="rf-input" type="number" min="0" step="10000" placeholder="最低">
          <span>—</span>
          <input id="fmax" class="rf-input" type="number" min="0" step="10000" placeholder="最高">
        </div>
      </div>

      <div class="rf-group">
        <label class="rf-label">状态</label>
        <label class="rf-switch"><input type="checkbox" id="factive" checked> 只看未截止</label>
        <label class="rf-switch"><input type="checkbox" id="fresult"> 含结果公告</label>
      </div>

      <div class="rf-group">
        <label class="rf-label" for="fsort">排序</label>
        <select id="fsort" class="rf-input">
          <option value="pub">按发布时间</option>
          <option value="due">按截止时间</option>
          <option value="budget">按预算金额</option>
          <option value="title">按标题</option>
        </select>
      </div>

      <button class="rf-reset" id="freset" type="button">清空筛选</button>
    </aside>

    <div class="radar-main">
      <div class="radar-bar">
        <span class="radar-count" id="rCount">加载中…</span>
        <button class="btn-ghost" id="btnCsv" type="button">导出 CSV</button>
      </div>

      <div class="radar-list" id="rList">
        <div class="dempty">加载中…</div>
      </div>

      <div class="radar-pager" id="rPager" hidden>
        <button id="pPrev" type="button">上一页</button>
        <span id="pInfo">—</span>
        <button id="pNext" type="button">下一页</button>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div class="foot-brand">
      <strong>lexify</strong>
      <p>法律数据洞察平台</p>
    </div>
    <div class="foot-legal">
      <p class="foot-note">© 2026 lexify. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="radar.js"></script>
<script src="nav-dropdown.js"></script>
<script src="ai-chat.js"></script>
</body>
</html>
