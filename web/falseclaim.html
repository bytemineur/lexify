<script src="data/falseclaim.js"></script>
<script src="board.js"></script>
<script>
(function () {
  var U = window.LexUtil;
  var esc = U.esc, raw = U.raw;

  var STAGE_LABEL = {
    decision: "行政处罚决定",
    notice: "事先告知",
    investigation: "立案调查",
    litigation: "投资者诉讼",
    measure: "监管措施",
    other: "其他公告"
  };
  var STAGE_TONE = {
    decision: "warn", notice: "accent", investigation: "mc",
    litigation: "", measure: "", other: ""
  };

  function clip(s, n) {
    s = s || "";
    if (s.length <= n) return s;
    return s.slice(0, n) + "…";
  }

  function stageTag(s) {
    if (!s) return "";
    var tone = STAGE_TONE[s];
    var cls = "tag" + (tone ? " " + tone : "");
    return '<span class="' + cls + '">' + esc(STAGE_LABEL[s] || s) + "</span>";
  }

  // 证监会全称太长，列里放不下：统一缩成「证监会 + 地方局」的写法，
  // 详情里仍然展示完整名称（title 属性也保留了原文）。
  function shortOrg(org) {
    if (!org) return "—";
    return org.replace(/^中国证券监督管理委员会/, "证监会")
              .replace(/^中国证监会/, "证监会");
  }

  function typesText(r) {
    if (!r.types || !r.types.length) return "";
    return r.types.map(function (t) { return esc(t); }).join(" · ");
  }

  LexBoard({
    key: "falseclaim",
    title: "证券虚假陈述",
    en: "Misrepresentation Claims",
    tagline: "证监会立案、事先告知、行政处罚决定这几类公告攒在一起，谁刚被查、谁已经可以被投资者起诉，一眼能看出来。",
    dateField: "date",
    search: ["name", "code", "title", "org", "board"],

    kpis: [
      { label: "公告事件", value: function (r, m) { return m.total; } },
      { label: "家上市公司", value: function (r, m) { return m.companies; } },
      { label: "已出处罚决定", value: function (r, m) { return m.decision; }, tone: "accent" },
      { label: "立案调查中", value: function (r, m) { return m.investigation; }, tone: "warn" }
    ],

    dayPresets: [
      { key: "p7", label: "近 7 天", test: function (d) { return d != null && d >= -7 && d <= 0; } },
      { key: "p30", label: "近 30 天", test: function (d) { return d != null && d >= -30 && d <= 0; } },
      { key: "p90", label: "近 90 天", test: function (d) { return d != null && d >= -90 && d <= 0; } },
      { key: "p365", label: "近一年", test: function (d) { return d != null && d >= -365 && d <= 0; } }
    ],

    facets: [
      { key: "stage", label: "处理阶段", type: "multi", field: "stage",
        labelOf: function (k) { return STAGE_LABEL[k] || k; } },
      { key: "board", label: "上市板块", type: "multi", field: "board", top: 6 },
      { key: "days", label: "公告日期", type: "days" }
    ],

    sort: { key: "date", dir: "desc" },

    columns: [
      {
        key: "name", label: "公司 / 代码", w: "20%",
        render: function (r) {
          var main = '<span class="t-main" title="' + esc(r.name) + '">' + esc(r.name || "—") + "</span>";
          var sub = r.code + (r.board ? " · " + r.board : "") +
                    (r.no > 1 ? " · 第 " + r.no + " 条" : "");
          return main + stageTag(r.stage) +
                 '<span class="t-sub" title="' + esc(sub) + '">' + esc(sub) + "</span>";
        }
      },
      {
        key: "title", label: "公告标题", w: "36%",
        render: function (r) {
          var main = '<span class="t-main" title="' + esc(r.title) + '">' +
                     esc(clip(r.title || "—", 34)) + "</span>";
          var t = typesText(r);
          return main + (t ? '<span class="t-sub">' + t + "</span>" : "");
        }
      },
      {
        key: "org", label: "处罚机关", w: "16%",
        render: function (r) {
          var main = '<span class="t-main" title="' + esc(r.org || "") + '">' +
                     esc(clip(shortOrg(r.org), 10)) + "</span>";
          var sub = r.no > 1 ? "该公司共 " + r.no + " 条记录" : "首次公告";
          return main + '<span class="t-sub">' + esc(sub) + "</span>";
        }
      },
      {
        key: "date", label: "公告日", w: "14%", firstDir: "desc",
        render: function (r) {
          var head = '<span class="t-main">' + esc(r.date || "—") + "</span>";
          var d = U.daysFrom(r.date);
          var sub = "";
          if (d != null) sub = d <= 0 ? (Math.abs(d) + " 天前") : (d + " 天后");
          return head + '<span class="t-sub">' + esc(sub) + "</span>";
        }
      },
      {
        key: "first", label: "首个事件日", w: "14%",
        render: function (r) {
          var head = '<span class="t-main">' + esc(r.first || "—") + "</span>";
          return head + '<span class="t-sub">区间起点</span>';
        }
      }
    ],

    dist: [
      { label: "阶段分布", field: "stage", top: 5, emptyLabel: "其他",
        labelOf: function (k) { return STAGE_LABEL[k] || k; } },
      { label: "板块分布", field: "board", top: 5, emptyLabel: "未识别" }
    ],

    presets: [
      {
        label: "已出处罚决定",
        test: function (r) { return r.stage === "decision"; },
        apply: function (st) { st.multi.stage = { decision: true }; }
      },
      {
        label: "立案调查中",
        test: function (r) { return r.stage === "investigation"; },
        apply: function (st) { st.multi.stage = { investigation: true }; }
      },
      {
        label: "近 30 天新公告",
        test: function (r) {
          var d = U.daysFrom(r.date);
          return d != null && d >= -30 && d <= 0;
        },
        apply: function (st) { st.days = "p30"; }
      }
    ],

    asideNote: "数据来自巨潮资讯（cninfo）的上市公司公告，只做「公告层面」的整理：" +
      "谁被立案、谁收到事先告知、谁已经拿到处罚决定。处罚决定书原文里才有违法事实、" +
      "责任人与罚款金额，点详情去看原文。索赔区间以法院认定为准，这里的「首个事件日」只是参考起点。",

    bodyEmpty: "（这条没有正文快照：公告原文是 PDF，点「去巨潮资讯看原文」查看）",

    detail: function (r) {
      var row = function (k, v) { return [k, v]; };
      var kv = [
        row("公司", raw(esc(r.name || "—") + "（" + esc(r.code || "—") + "）")),
        row("上市板块", r.board || "—"),
        row("处理阶段", raw(stageTag(r.stage) || "—")),
        row("违规类型", typesText(r) || "公告标题未写明"),
        row("处罚机关", r.org || "—"),
        row("公告日期", r.date || "—"),
        row("首个事件日", r.first || "—"),
        row("公告标题", r.title || "—")
      ];
      return {
        title: r.name || "证券虚假陈述线索",
        sub: (r.code || "") + (r.board ? " · " + r.board : "") + " · " + (r.date || ""),
        kv: kv
      };
    }
  });
})();
</script>
