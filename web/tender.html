<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-mlp="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招标雷达 · Lexify</title>
<meta name="description" content="全国政府采购与公共资源交易平台的公开招标，抽取预算金额与投标截止时间，按截止日排序。">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="millennium.css">
</head>
<body class="board-tender">

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M7.8 4.4Q7 4.4 7 5.2v13.5h10v-2.2a1.1 1.1 0 0 0-1.1-1.1h-5.7V4.4z" fill="currentColor"/>
        </svg>
    </span>
    <span class="brand-text"><strong>Lexify</strong><em>法律数据洞察平台</em></span>
  </a>

  <nav class="btabs" aria-label="看板切换">
    <a href="tender.html" data-b="tender" class="on"><i class="bdot"></i>招标雷达</a>
    <a href="hearing.html" data-b="hearing"><i class="bdot"></i>开庭公告</a>
    <a href="bounty.html" data-b="bounty"><i class="bdot"></i>执行悬赏</a>
  </nav>

  <div class="topbar-right">
      </div>
</header>

<div class="bhead">
  <div class="wrap">
    <div class="bhead-in">
      <h1 id="bTitle"></h1>
      <div class="bhead-row">
        <p class="sub" id="bSub"></p>
        <div class="bhead-meta" id="bMeta"></div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</div>

<div class="filters">
  <div class="wrap" id="facets"></div>
</div>

<main class="board-main">
  <div class="wrap">
    <div class="toolbar">
      <div class="tsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.6"/><path d="m16.2 16.2 4.3 4.3"/>
        </svg>
        <input id="q" type="search" placeholder="搜项目名称、采购人、地区或正文…" autocomplete="off">
      </div>
      <span class="tcount" id="tcount"></span>
      <button class="btn-sm" id="btnReset">清空筛选</button>
      <button class="btn-sm solid" id="btnExport">导出 CSV</button>
    </div>

    <div class="mgrid">
      <div class="twrap">
        <div class="tscroll">
          <table class="list">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pager" id="pager"></div>
      </div>
      <aside class="aside" id="aside"></aside>
    </div>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-box">
    <div class="modal-h">
      <div>
        <h3 id="mTitle"></h3>
        <div class="sub" id="mSub"></div>
      </div>
      <button class="modal-x" data-close>×</button>
    </div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f">
      <a class="btn-sm" id="mLink" target="_blank" rel="noopener">去采购平台看原文</a>
      <button class="btn-sm" data-close>关闭</button>
    </div>
  </div>
</div>

<script src="data/tender.js"></script>
<script src="board.js"></script>
<script>
(function () {
  var U = window.LexUtil;
  var esc = U.esc, money = U.money;

  function clip(s, n) {
    s = s || "";
    if (s.length <= n) return s;
    return s.slice(0, n) + "…";
  }

  function dayCell(r) {
    var d = U.daysFrom(r.due);
    if (d == null) return '<span style="color:var(--text-3)">未写截止时间</span>';
    var cls = "";
    if (d < 0) cls = "past";
    else if (d <= 3) cls = "soon";
    else if (d <= 7) cls = "week";
    var txt = d < 0 ? "已截止" : (d === 0 ? "今天截止" : d + " 天后截止");
    return '<span class="days ' + cls + '">' + txt + "</span>";
  }

  LexBoard({
    title: "招标雷达",
    en: "Tender Radar",
    tagline: "全国政府采购与公共资源交易平台的公开招标。按投标截止日排序，先看还来得及投的。",
    dateField: "due",
    amountField: "amount",
    search: ["title", "org", "agency", "cat", "prov", "city", "body"],

    metaExtra: function () {
      return " · 数据源 <b>政府采购网 / 公共资源交易中心 / 央企与军队采购</b>";
    },

    kpis: [
      { label: "招标公告", value: function (r, m) { return m.total; } },
      { label: "个采购平台", value: function (r, m) { return m.sources; } },
      { label: "7 天内截止", value: function (r, m) { return m.dueSoon; }, tone: "warn" },
      // 这里原本是「带预算金额 259」，259 是条数，标签却写着金额，量纲对不上。
      // 改成金额本身（亿），条数退到标签里说明口径。
      {
        label: function (m) { return "已披露预算合计 · " + m.withAmount + " 条"; },
        value: function (r, m) { return m.amountSum; },
        fmt: "yi",
        tone: "accent"
      }
    ],

    dayPresets: [
      { key: "d3", label: "3 天内截止", test: function (d) { return d != null && d >= 0 && d <= 3; } },
      { key: "d7", label: "7 天内截止", test: function (d) { return d != null && d >= 0 && d <= 7; } },
      { key: "d15", label: "15 天内截止", test: function (d) { return d != null && d >= 0 && d <= 15; } },
      { key: "due30", label: "30 天内截止", test: function (d) { return d != null && d >= 0 && d <= 30; } },
      { key: "past", label: "已截止", test: function (d) { return d != null && d < 0; } }
    ],

    facets: [
      { key: "days", label: "截止时间", type: "days" },
      { key: "type", label: "公告类型", type: "multi", field: "type", top: 8 },
      {
        key: "cat", label: "行业", type: "multi", field: "cat", top: 8,
        labelOf: function (k) {
          var m = /^(.+?)[A-Z]\d{6,}$/.exec(k);
          return m ? m[1] : k;
        }
      },
      { key: "prov", label: "地区", type: "multi", field: "prov", top: 10 },
      {
        key: "amount", label: "预算金额", type: "amount", unit: "元",
        presets: [
          { label: "50 万以上", min: 500000, max: null },
          { label: "100 万以上", min: 1000000, max: null },
          { label: "500 万以上", min: 5000000, max: null }
        ]
      },
    ],

    sort: { key: "due", dir: "asc" },

    columns: [
      {
        key: "title", label: "项目 / 采购人", w: "38%",
        render: function (r) {
          var sub = r.org || "采购人未披露";
          if (r.agency) sub += " · 代理 " + r.agency;
          return '<span class="t-main" title="' + esc(r.title || "") + '">' +
                 esc(clip(r.title, 46)) + "</span>" +
                 '<span class="t-sub" title="' + esc(sub) + '">' + esc(clip(sub, 40)) + "</span>";
        }
      },
      {
        key: "amount", label: "预算", cls: "num", w: "13%", firstDir: "desc",
        render: function (r) {
          if (!r.amount) return '<span style="color:var(--text-3)">—</span>';
          return "<b>" + esc(money(r.amount)) + "</b>";
        },
        csvVal: function (r) { return r.amount == null ? "" : Math.round(r.amount); }
      },
      {
        key: "due", label: "投标截止", cls: "nowrap", w: "16%", firstDir: "asc",
        // 排序值：未截止用天数（越小越靠前），已截止整体沉底，
        // 否则库里 2018 年的历史公告会把第一页占满
        sortVal: function (r) {
          var d = U.daysFrom(r.due);
          if (d == null) return null;
          if (d >= 0) return d;
          return 100000 + Math.abs(d);
        },
        render: function (r) {
          var head = '<span class="t-main">' + esc(r.due || "—") + "</span>";
          if (r.dueConfident === false) head += ' <span class="tag warn">需核对</span>';
          return head + '<span class="t-sub">' + dayCell(r) + "</span>";
        },
        csvVal: function (r) { return (r.due || "") + " " + (r.dueRaw || ""); }
      },
      {
        key: "type", label: "类型", w: "13%",
        render: function (r) {
          return '<span class="tag mc">' + esc(r.type || "—") + "</span>";
        }
      },
      {
        key: "prov", label: "地区", w: "18%",
        render: function (r) {
          var loc = r.prov || "未识别";
          if (r.city && r.city !== r.prov) loc += " · " + r.city;
          return '<span class="t-main">' + esc(loc) + "</span>" +
                 (r.pub ? '<span class="t-sub">发布于 ' + esc(r.pub) + "</span>" : "");
        }
      }
    ],

    dist: [
      { label: "行业分布", field: "cat", top: 8, emptyLabel: "未分类" },
      { label: "地区分布", field: "prov", top: 8, emptyLabel: "未识别" }
    ],

    presets: [
      {
        label: "7 天内截止",
        test: function (r) {
          var d = U.daysFrom(r.due);
          return d != null && d >= 0 && d <= 7;
        },
        apply: function (st) { st.days = "d7"; }
      },
      {
        label: "只看法律服务类",
        test: function (r) { return r.cat === "法律服务"; },
        apply: function (st) { st.multi.cat = { "法律服务": true }; }
      },
      {
        label: "预算 100 万以上",
        test: function (r) { return r.amount != null && r.amount >= 1e6; },
        apply: function (st) { st.amountMin = 1000000; }
      }
    ],

    asideNote: "预算与截止时间是程序从公告原文抽取的。部分平台把「获取招标文件截止」写成开标时间，" +
      "这类会标「需核对」。投标前请以采购平台原文为准。",

    detail: function (r) {
      var d = U.daysFrom(r.due);
      var due = r.due || "未写";
      if (d != null) due += "（" + (d < 0 ? "已截止" : d + " 天后截止") + "）";
      var amt = "未披露";
      if (r.amount) {
        amt = "<b>" + esc(money(r.amount)) + "</b>（" +
              Math.round(r.amount).toLocaleString("zh-CN") + " 元）";
      }
      return {
        title: r.title || "招标公告",
        sub: (r.org || "") + (r.type ? " · " + r.type : ""),
        kv: [
          ["采购人", esc(r.org || "未披露")],
          ["代理机构", esc(r.agency || "—")],
          ["预算金额", amt],
          ["投标截止", esc(due) + (r.dueRaw ? '<span class="t-sub">原文：' + esc(r.dueRaw) + "</span>" : "")],
          ["公告类型", esc(r.type || "—")],
          ["行业", esc(r.cat || "—")],
          ["地区", esc((r.prov || "") + (r.city ? " " + r.city : ""))],
          ["发布日期", esc(r.pub || "—")],
          ["数据源", esc(r.src || "—")]
        ]
      };
    }
  });})();
</script>
</body>
</html>
