<script src="board.js"></script>
<script>
(function () {
  var U = window.LexUtil;
  var esc = U.esc, raw = U.raw;

  var SEV_LABEL = {
    high: "未缴比例高",
    mid: "存在欠缴",
    low: "接近全覆盖"
  };
  var SEV_TONE = { high: "warn", mid: "mc", low: "" };

  function clip(s, n) {
    s = s || "";
    if (s.length <= n) return s;
    return s.slice(0, n) + "…";
  }

  // PDF 抽出来的句子常带引号、（十四）这种编号和断行空格，展示前先收拾干净。
  function tidy(s) {
    s = (s || "").replace(/\s+/g, " ").trim();
    s = s.replace(/^["'\u2018\u2019\u201c\u201d\s]+/, "");
    s = s.replace(/^（\s*\d+\s*）/, "").replace(/^\(\s*\d+\s*\)/, "");
    s = s.replace(/^\d+、/, "");
    return s.trim();
  }

  function sevTag(s) {
    if (!s) return "";
    var tone = SEV_TONE[s];
    var cls = "tag" + (tone ? " " + tone : "");
    return '<span class="' + cls + '">' + esc(SEV_LABEL[s] || s) + "</span>";
  }

  function payText(r) {
    if (r.head && r.paid) {
      return r.paid + " / " + r.head + " 人";
    }
    return "未披露人数";
  }

  LexBoard({
    key: "labor",
    title: "劳动争议",
    en: "Labor & Social Insurance",
    tagline: "招股说明书里藏着一类稳定的案源：报告期内没给员工缴（足额缴）社保、公积金的公司。" +
      "这里把这类披露抽出来，谁欠、涉及多少人、实际控制人有没有承诺兜底，一行一条。",
    dateField: "date",
    search: ["name", "code", "title", "snippet", "board"],

    kpis: [
      { label: "披露事件", value: function (r, m) { return m.total; } },
      { label: "家公司", value: function (r, m) { return m.companies; } },
      { label: "社保 + 公积金", tone: "warn", value: function (r, m) {
          return (window.__BOARD__.rows || []).filter(function (x) {
            return (x.kind || "").indexOf("+") >= 0; }).length; } },
      { label: "附兜底承诺", value: function (r, m) {
          return (window.__BOARD__.rows || []).filter(function (x) { return x.promise; }).length;
        }, tone: "accent" }
    ],

    dayPresets: [
      { key: "p30", label: "近 30 天", test: function (d) { return d != null && d >= -30 && d <= 0; } },
      { key: "p90", label: "近 90 天", test: function (d) { return d != null && d >= -90 && d <= 0; } },
      { key: "p180", label: "近半年", test: function (d) { return d != null && d >= -180 && d <= 0; } },
      { key: "p365", label: "近一年", test: function (d) { return d != null && d >= -365 && d <= 0; } }
    ],

    facets: [
      { key: "sev", label: "欠缴程度", type: "multi", field: "severity",
        labelOf: function (k) { return SEV_LABEL[k] || k; } },
      { key: "board", label: "上市板块", type: "multi", field: "board", top: 6 },
      { key: "kind", label: "欠缴类型", type: "multi", field: "kind",
        labelOf: function (k) { return k; } },
      { key: "days", label: "披露日期", type: "days" }
    ],

    sort: { key: "date", dir: "desc" },

    columns: [
      {
        key: "name", label: "公司 / 代码", w: "20%",
        render: function (r) {
          var main = '<span class="t-main" title="' + esc(r.name) + '">' + esc(r.name || "—") + "</span>";
          var sub = r.code + (r.board ? " · " + r.board : "");
          return main + sevTag(r.severity) +
                 '<span class="t-sub" title="' + esc(sub) + '">' + esc(sub) + "</span>";
        }
      },
      {
        key: "snippet", label: "披露内容（原句）", w: "34%",
        render: function (r) {
          var main = '<span class="t-main" title="' + esc(r.snippet) + '">' +
                     esc(clip(tidy(r.snippet) || "—", 40)) + "</span>";
          var parts = [];
          if (r.kind) parts.push(r.kind);
          if (r.page) parts.push("第 " + r.page + " 页");
          if (r.docType) parts.push(r.docType);
          return main + '<span class="t-sub">' + esc(parts.join(" · ")) + "</span>";
        }
      },
      {
        key: "ratio", label: "缴纳情况", w: "16%",
        render: function (r) {
          var main = '<span class="t-main">' + esc(payText(r)) + "</span>";
          var sub = r.ratio ? ("已缴 " + r.ratio + "%") : "未披露比例";
          return main + '<span class="t-sub">' + esc(sub) + "</span>";
        }
      },
      {
        key: "promise", label: "兜底承诺", w: "16%",
        render: function (r) {
          var main = '<span class="t-main">' +
                     (r.promise ? "实控人已承诺" : "未见承诺") + "</span>";
          var sub = r.amount ? ("补缴 " + r.amount + " 万元") : "金额未披露";
          return main + '<span class="t-sub">' + esc(sub) + "</span>";
        }
      },
      {
        key: "date", label: "披露日期", w: "14%", firstDir: "desc",
        render: function (r) {
          var head = '<span class="t-main">' + esc(r.date || "—") + "</span>";
          var d = U.daysFrom(r.date);
          var sub = "";
          if (d != null) sub = d <= 0 ? (Math.abs(d) + " 天前") : (d + " 天后");
          return head + '<span class="t-sub">' + esc(sub) + "</span>";
        }
      }
    ],

    dist: [
      { label: "欠缴程度", field: "severity", top: 3,
        labelOf: function (k) { return SEV_LABEL[k] || k; } },
      { label: "板块分布", field: "board", top: 5, emptyLabel: "未识别" }
    ],

    presets: [
      {
        label: "未缴比例偏高",
        test: function (r) { return r.severity === "high"; },
        apply: function (st) { st.multi.sev = { high: true }; }
      },
      {
        label: "有兜底承诺",
        test: function (r) { return !!r.promise; },
        apply: function (st) { st.q = "承诺"; }
      },
      {
        label: "近 90 天披露",
        test: function (r) {
          var d = U.daysFrom(r.date);
          return d != null && d >= -90 && d <= 0;
        },
        apply: function (st) { st.days = "p90"; }
      }
    ],

    asideNote: "数据来自巨潮资讯（cninfo）的 IPO 招股说明书全文，只摘录「未缴纳 / 未足额缴纳社会保险、住房公积金」" +
      "相关段落，不做法律判断。欠缴事实与金额以原文和主管部门认定为准；招股书里的「已缴比例」是报告期末口径，" +
      "不同公司披露的时点、人数统计范围并不一致。点详情可以看原句与原文 PDF。",

    bodyEmpty: "（这条没有正文快照：招股说明书原文是 PDF，点「去巨潮资讯看原文」查看）",

    detail: function (r) {
      var row = function (k, v) { return [k, v]; };
      var list = (r.snippets && r.snippets.length) ? r.snippets : [r.snippet];
      var extra = list.slice(1).map(function (s) {
        return '<p>' + esc(s) + '</p>';
      }).join("");
      var kv = [
        row("公司", raw(esc(r.name || "—") + "（" + esc(r.code || "—") + "）")),
        row("上市板块", r.board || "—"),
        row("文件", (r.docType || "招股说明书") + (r.page ? "（第 " + r.page + " 页）" : "")),
        row("欠缴类型", r.kind || "—"),
        row("缴纳情况", payText(r) + (r.ratio ? "，已缴 " + r.ratio + "%" : "，比例未披露")),
        row("兜底承诺", r.promise ? "实际控制人承诺补偿" : "未见承诺"),
        row("补缴金额", r.amount ? r.amount + " 万元" : "未披露"),
        row("披露日期", r.date || "—"),
        row("文件标题", r.title || "—"),
        row("原文摘录", raw('<div class="m-quote">' + '<p>' + esc(r.snippet || "—") + "</p>" + extra + "</div>"))
      ];
      return {
        title: r.name || "劳动争议线索",
        sub: (r.code || "") + (r.board ? " · " + r.board : "") + " · " + (r.date || ""),
        kv: kv
      };
    }
  });
})();
</script>
