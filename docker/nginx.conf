# 缓存策略按路径分档：数据每天重导必须回源，样式脚本短期缓存，图片长缓存。
#
# 为什么用 map 而不用逐 location 写 add_header：nginx 的 add_header 一旦在
# location 块内出现，就不再继承 server 级的那些头 —— 于是 /data/ 与 *.js
# 的响应会把 X-Content-Type-Options / X-Frame-Options / Referrer-Policy
# 整块丢掉（实测确认）。改成「一处 add_header + 由 map 出值」，所有
# location 都能继承。
map $uri $lexify_cache {
    default                             "no-cache";
    "~^/data/"                          "no-cache";
    "~*\.(css|js)$"                     "public, max-age=3600";
    "~*\.(png|jpe?g|gif|svg|ico|webp)$" "public, max-age=604800";
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;

    # 数据文件单个最大 7.3 MB，不压缩的话首屏要等很久
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml;

    # 站点没有后端，关掉不必要的暴露
    server_tokens off;

    add_header Cache-Control $lexify_cache;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 目录不做列表，避免 /data/ 被直接遍历
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }
}
